<!-- Fragment loaded into the main app shell (All Tracking) -->
<div class="card" style="box-shadow:none;border:none;padding:0;margin:0;">
  <h1>All Tracking <span style="font-weight:500;color:#64748b;font-size:0.95rem;">(Completed / Archived)</span></h1>
  <p style="color:#64748b;margin-top:-0.25rem;margin-bottom:1rem;font-size:0.9rem;">
    These are tracking shipments marked <strong>Done</strong>. Click a tracking number to view devices.
  </p>

  <div id="archiveFilters" style="display:flex;flex-wrap:wrap;gap:0.75rem;align-items:flex-end;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:0.85rem 1rem;margin-bottom:0.75rem;">
    <div style="flex:1;min-width:220px;">
      <label for="archiveSearch" style="display:block;font-size:0.8rem;font-weight:600;color:#64748b;margin-bottom:0.25rem;">Search (tracking #, serial, model, notes, order #)</label>
      <input type="text" id="archiveSearch" placeholder="Type to filter..." style="width:100%;padding:0.5rem 0.65rem;border:1px solid #e2e8f0;border-radius:8px;font:inherit;">
    </div>
    <div>
      <label for="archiveDateFrom" style="display:block;font-size:0.8rem;font-weight:600;color:#64748b;margin-bottom:0.25rem;">From date</label>
      <input type="date" id="archiveDateFrom" style="padding:0.5rem 0.65rem;border:1px solid #e2e8f0;border-radius:8px;font:inherit;">
    </div>
    <div>
      <label for="archiveDateTo" style="display:block;font-size:0.8rem;font-weight:600;color:#64748b;margin-bottom:0.25rem;">To date</label>
      <input type="date" id="archiveDateTo" style="padding:0.5rem 0.65rem;border:1px solid #e2e8f0;border-radius:8px;font:inherit;">
    </div>
    <div>
      <label for="archiveSort" style="display:block;font-size:0.8rem;font-weight:600;color:#64748b;margin-bottom:0.25rem;">Sort</label>
      <select id="archiveSort" style="padding:0.5rem 0.65rem;border:1px solid #e2e8f0;border-radius:8px;font:inherit;">
        <option value="date_desc">Date — newest first</option>
        <option value="date_asc">Date — oldest first</option>
        <option value="qty_desc">Quantity — high to low</option>
        <option value="qty_asc">Quantity — low to high</option>
        <option value="tn_asc">Tracking # — A to Z</option>
      </select>
    </div>
    <div>
      <label for="archivePageSize" style="display:block;font-size:0.8rem;font-weight:600;color:#64748b;margin-bottom:0.25rem;">Per page</label>
      <select id="archivePageSize" style="padding:0.5rem 0.65rem;border:1px solid #e2e8f0;border-radius:8px;font:inherit;">
        <option value="100">100</option>
        <option value="250">250</option>
        <option value="500" selected>500</option>
        <option value="1000">1000</option>
        <option value="all">ALL</option>
      </select>
    </div>
    <div>
      <button type="button" id="archiveClearFilters" class="btn btn-secondary" style="padding:0.5rem 0.9rem;">Clear</button>
    </div>
  </div>

  <div id="archivePager" style="display:none;gap:0.5rem;align-items:center;margin-bottom:0.5rem;">
    <button type="button" id="archivePrevPage" class="btn btn-secondary" style="padding:0.35rem 0.8rem;">&larr; Prev</button>
    <span id="archivePageInfo" style="color:#64748b;font-size:0.9rem;"></span>
    <button type="button" id="archiveNextPage" class="btn btn-secondary" style="padding:0.35rem 0.8rem;">Next &rarr;</button>
  </div>

  <div id="archiveStatus" style="color:#64748b;font-size:0.9rem;margin-bottom:0.5rem;">Loading…</div>
  <div class="table-wrap">
    <table id="archiveTable">
      <tr>
        <th>Date</th>
        <th>Tracking Number</th>
        <th>Quantity</th>
        <th>Remaining</th>
        <th>Devices</th>
      </tr>
    </table>
  </div>
</div>
