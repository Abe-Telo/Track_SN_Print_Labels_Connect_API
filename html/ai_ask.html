<!-- Fragment: AI Ask -->
<div class="aiask-page" id="aiAskPage">
  <aside class="aiask-sidebar">
    <div class="aiask-sidebar-head">
      <strong>AI Ask</strong>
      <button type="button" class="btn" id="aiAskNew">New chat</button>
    </div>
    <p class="aiask-sidebar-hint">Read-only system data · safe warranty refresh when you ask</p>
    <div class="aiask-sidebar-tabs">
      <button type="button" class="aiask-side-tab is-active" data-session-filter="active" id="aiAskTabActive">Chats</button>
      <button type="button" class="aiask-side-tab" data-session-filter="archived" id="aiAskTabArchived">Archived <span id="aiAskArchivedCount"></span></button>
    </div>
    <div id="aiAskSessionList" class="aiask-session-list"></div>
  </aside>

  <section class="aiask-main">
    <div class="aiask-top">
      <div>
        <h1 id="aiAskTitle">AI Ask</h1>
        <p class="aiask-sub" id="aiAskStatusLine">Ask about devices, repairs, orders, warranty…</p>
      </div>
    </div>

    <div id="aiAskMessages" class="aiask-messages" aria-live="polite"></div>

    <div class="aiask-composer">
      <div class="aiask-suggestions" id="aiAskSuggestions">
        <button type="button" class="aiask-chip" data-prompt="How many open repair tickets are there by stage?">Open repairs overview</button>
        <button type="button" class="aiask-chip" data-prompt="Look up serial ">Lookup a serial…</button>
        <button type="button" class="aiask-chip" data-prompt="Find repair tickets waiting on MS labels">Ship / labels queue</button>
        <button type="button" class="aiask-chip" data-prompt="Show shipping label PDFs and MS email history for the last serial we discussed">Labels + emails</button>
        <button type="button" class="aiask-chip" data-prompt="What have people been asking AI Ask lately?">Question insights</button>
        <button type="button" class="aiask-chip" data-prompt="Remember that we already complete standard Surface troubleshooting before contacting MS">Save training memory</button>
      </div>
      <form id="aiAskForm" class="aiask-form">
        <textarea id="aiAskInput" rows="2" placeholder="Ask anything about Tracking data…" autocomplete="off"></textarea>
        <button type="submit" class="btn" id="aiAskSend">Send</button>
      </form>
      <p class="aiask-footer-note">Chats ~6 months. Answers include Repair needed / label PDF / UPS links when available. Say “remember that …” for training memory.</p>
    </div>
  </section>
</div>
