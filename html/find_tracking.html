async function fetchOrderData() {
    const identifier = document.getElementById('trackingNumber').value;
    if (!identifier) {
        alert('Please enter a tracking number or an order number.');
        return;
    }

    let combinedData = {};
    let warehouseData = {}; // Initialize as an empty object to avoid undefined access

    try {
        let response = await fetch(`/get-fullResponse-by-tracking/${identifier}`);
        if (!response.ok) {
            response = await fetch(`/get-tracking-by-order/${identifier}`);
        }
        if (!response.ok) {
            throw new Error('Failed to fetch data using the provided identifier.');
        }
        combinedData = await response.json();

        // Normalize the data structure
        if (combinedData.shipmentDetails) {
            combinedData.apiTrackingfullResponse = combinedData.shipmentDetails;
        }

        const orderNumber = combinedData.apiTrackingfullResponse?.orderNumber || combinedData.orderNumber;

        if (orderNumber) {
            const orderDetailsResponse = await fetch(`/get-order-full/${orderNumber}`);
            if (orderDetailsResponse.ok) {
                const orderDetails = await orderDetailsResponse.json();
                combinedData.orderDetails = orderDetails;
                if (orderDetails.items) {
                    combinedData.items = orderDetails.items;
                }
            }
        }

        const warehouseId = combinedData.apiTrackingfullResponse?.warehouseId;
        if (warehouseId) {
            response = await fetch(`/get-warehouse/${warehouseId}`);
            if (response.ok) {
                warehouseData = await response.json();
            }
        }

        combinedData.warehouseData = warehouseData; // Assign regardless of fetch outcome

        displayOrderDetails(combinedData);
    } catch (error) {
        console.error('Error fetching order details:', error);
        document.getElementById('orderDetails').innerText = `Error fetching order details: ${error.message}`;
    }
}

function createTable_AllObjects(parent, data, title) {
    if (Array.isArray(data)) {
        // Create a section for items
        const itemsSection = document.createElement('section');
        itemsSection.className = 'items-section';
        const sectionTitle = document.createElement('h2');
        sectionTitle.textContent = title;
        itemsSection.appendChild(sectionTitle);
        parent.appendChild(itemsSection);

        // Iterate over each item and create a nested table
        data.forEach((item, index) => {
            const itemTitle = document.createElement('h3');
            itemTitle.textContent = `Item ${index + 1}`;
            itemsSection.appendChild(itemTitle);

            const nestedTable = createNestedTable(item);
            itemsSection.appendChild(nestedTable);
        });
    } else if (typeof data === 'object') {
        const tableWrapper = document.createElement('div');
        tableWrapper.className = 'table-wrapper';
        parent.appendChild(tableWrapper);

        const table = createNestedTable(data);
        tableWrapper.appendChild(table);

        const headerRow = table.insertRow(0);
        const th = document.createElement('th');
        th.textContent = title;
        th.colSpan = 2;
        headerRow.appendChild(th);
    }
}


function createTable(parent, data, title, showAllObjects = false, excluding = []) {
    const tableWrapper = document.createElement('div');
    tableWrapper.className = 'table-wrapper';
    parent.appendChild(tableWrapper);

    const table = document.createElement('table');
    tableWrapper.appendChild(table);

    const thead = document.createElement('thead');
    table.appendChild(thead);
    const headerRow = document.createElement('tr');
    thead.appendChild(headerRow);
    const th = document.createElement('th');
    th.textContent = title;
    th.colSpan = 2; // Assuming two columns for key-value pairs
    headerRow.appendChild(th);

    const tbody = document.createElement('tbody');
    table.appendChild(tbody);

    // Convert excluding items to a lookup set for efficiency
    const excludeSet = new Set(excluding);

    // Define a function to append rows to the table body
    const addRow = (key, value) => {
        // Skip keys that are in the exclusion set
        if (excludeSet.has(key)) {
            return;
        }

        const row = tbody.insertRow();
        const cellKey = row.insertCell();
        cellKey.textContent = key;
        const cellValue = row.insertCell();

        // Determine how to display the value
        if (showAllObjects && typeof value === 'object' && value !== null) {
            cellValue.textContent = JSON.stringify(value, null, 2); // Stringify object
        } else if (typeof value === 'object' && value !== null) {
            cellValue.textContent = '[Complex Object]'; // Placeholder for complex objects
        } else {
            cellValue.textContent = value; // Display simple data types directly
        }
    };

    // Handle data if it's an array
    if (Array.isArray(data)) {
        data.forEach((item, index) => {
            // Optionally, create a section header for each item
            Object.entries(item).forEach(([key, value]) => {
                addRow(key, value); // Add each property of the item as a row
            });
            // Optionally, add a separator after each item except the last
            if (index < data.length - 1) {
                const separatorRow = tbody.insertRow();
                const cell = separatorRow.insertCell();
                cell.colSpan = 2;
                cell.className = 'separator'; // Make sure to style this class for visual separation
            }
        });
    } else if (typeof data === 'object' && data !== null) {
        // Handle data if it's a single object
        Object.entries(data).forEach(([key, value]) => {
            addRow(key, value); // Add each property of the object as a row
        });
    } else {
        // Handle data if it's a single value (string, number, etc.)
        addRow(title, data); // Use title as key, and data as value
    }
}

// Utility function to create a nested table for properties that are objects
function createNestedTable(data) {
    const table = document.createElement('table');
    const tbody = document.createElement('tbody');
    table.appendChild(tbody);

    Object.entries(data).forEach(([key, value]) => {
        const row = tbody.insertRow();
        const cellKey = row.insertCell();
        cellKey.textContent = key;
        const cellValue = row.insertCell();

        // If the value is an object, recurse and create a nested table
        if (value && typeof value === 'object' && !Array.isArray(value)) {
            cellValue.appendChild(createNestedTable(value));
        } else {
            cellValue.textContent = value;
        }
    });

    return table;
}
